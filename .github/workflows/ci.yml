name: CI Pipeline - Test Automation

# Triggers del pipeline
on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    # Paso 1: Checkout del código
    - name: Checkout repository
      uses: actions/checkout@v4
      
    # Paso 2: Configurar Java 11
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    # Paso 3: Cache de dependencias Maven
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    # Paso 4: Compilar proyecto
    - name: Compile project
      run: mvn clean compile
      
    # Paso 5: Ejecutar tests unitarios
    - name: Run unit tests
      run: mvn test
      
    # Paso 6: Generar reporte de tests
    - name: Generate test reports
      run: mvn surefire-report:report
      if: always()
      
    # Paso 7: Publicar resultados de tests
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true
        
    # Paso 8: Subir artefactos (reportes)
    - name: Upload test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports
        path: |
          target/surefire-reports/
          target/site/
        retention-days: 30
        
    # Paso 9: Verificar cobertura básica
    - name: Check test coverage
      run: |
        echo "=== RESUMEN DE TESTS EJECUTADOS ==="
        find target/surefire-reports -name "*.txt" -exec cat {} \;
        echo "=================================="
